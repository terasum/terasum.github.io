{{- $target := printf "%s#articles" .Site.Home.RelPermalink -}}
<!doctype html>
<html lang="{{ .Site.Language.Locale }}">
<head>
    <meta charset="utf-8">
    <title>全部文章 · {{ .Site.Title }}</title>
    <link rel="canonical" href="{{ .Site.Home.Permalink }}">
    <meta http-equiv="refresh" content="0; url={{ $target }}">
</head>
<body><p><a href="{{ $target }}">查看全部文章</a></p></body>
</html>
