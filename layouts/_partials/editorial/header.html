<header class="editorial-header" id="page-start">
    <a class="editorial-brand" href="{{ .Site.Home.RelPermalink }}">{{ .Site.Title }}</a>
    <nav aria-label="主导航">
        <a href="{{ .Site.Home.RelPermalink }}"{{ if .IsHome }} aria-current="page"{{ end }}>首页</a>
        <a href="{{ .Site.Home.RelPermalink }}#articles">文章</a>
        {{ with .Site.Home.OutputFormats.Get "rss" }}<a href="{{ .RelPermalink }}">RSS</a>{{ end }}
    </nav>
</header>
