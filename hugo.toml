baseURL = "https://chenquan.me/"
title = "codestack"
locale = "zh-cn"
defaultContentLanguage = "zh"
hasCJKLanguage = true

[pagination]
pagerSize = 8

[[module.imports]]
path = "github.com/CaiJimmy/hugo-theme-stack/v4"

[[menus.main]]
name = "首页"
pageRef = "/"
weight = 10
[menus.main.params]
icon = "home"

[[menus.main]]
name = "全部文章"
url = "/#articles"
weight = 20
[menus.main.params]
icon = "archives"

[params]
mainSections = ["posts"]
rssFullContent = true

[params.sidebar]
subtitle = "技术笔记与工程实践"

[params.article]
headingAnchor = true
readingTime = true

[params.article.license]
enabled = false

[params.comments]
enabled = false

[params.widgets]
homepage = [{ type = "categories", params = { limit = 6 } }]
page = [{ type = "toc" }]

[markup.tableOfContents]
startLevel = 2
endLevel = 3

[markup.highlight]
noClasses = false
tabWidth = 4

[params.dateFormat]
published = "2006-01-02"
lastUpdated = "2006-01-02"

[markup.goldmark.extensions.passthrough]
enable = true

[markup.goldmark.extensions.passthrough.delimiters]
block = [['$$', '$$']]
inline = [['\(', '\)']]
