<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 286" role="img" aria-labelledby="title desc">
  <title id="title">比特币交易验证路径</title><desc id="desc">一笔交易依次经过结构检查、UTXO 查询、脚本验证、状态应用和确认。</desc>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif}.box{fill:#fff;stroke:#d9dce2;stroke-width:2}.label{fill:#15171a;font-size:18px;font-weight:600}.sub{fill:#6a707c;font-size:13px}.line{stroke:#202329;stroke-width:2.5;fill:none}.dot{fill:#202329}</style>
  <rect width="1120" height="286" rx="18" fill="#f5f5f4"/>
  <text x="48" y="55" class="sub">一笔交易在节点中的验证顺序</text>
  <g transform="translate(48 99)"><rect class="box" width="170" height="104" rx="12"/><text x="85" y="43" text-anchor="middle" class="label">交易字节</text><text x="85" y="70" text-anchor="middle" class="sub">格式与金额检查</text></g>
  <path class="line" d="M218 151h50"/><path d="M268 151l-9-6v12z" class="dot"/>
  <g transform="translate(278 99)"><rect class="box" width="170" height="104" rx="12"/><text x="85" y="43" text-anchor="middle" class="label">查询 UTXO</text><text x="85" y="70" text-anchor="middle" class="sub">输入是否仍可花费</text></g>
  <path class="line" d="M448 151h50"/><path d="M498 151l-9-6v12z" class="dot"/>
  <g transform="translate(508 99)"><rect class="box" width="170" height="104" rx="12"/><text x="85" y="43" text-anchor="middle" class="label">脚本验证</text><text x="85" y="70" text-anchor="middle" class="sub">授权与签名检查</text></g>
  <path class="line" d="M678 151h50"/><path d="M728 151l-9-6v12z" class="dot"/>
  <g transform="translate(738 99)"><rect class="box" width="170" height="104" rx="12"/><text x="85" y="43" text-anchor="middle" class="label">状态转换</text><text x="85" y="70" text-anchor="middle" class="sub">旧输出消失，新输出出现</text></g>
  <path class="line" d="M908 151h50"/><path d="M958 151l-9-6v12z" class="dot"/>
  <g transform="translate(968 99)"><rect class="box" width="104" height="104" rx="12" fill="#e7e8ea"/><text x="52" y="43" text-anchor="middle" class="label">确认</text><text x="52" y="70" text-anchor="middle" class="sub">活跃链</text></g>
</svg>
